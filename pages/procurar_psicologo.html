<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MentalHelp - Procurar Psicólogo</title>

    <link rel="stylesheet" href="/styles/Login.css" />
    <link rel="stylesheet" href="/styles/Style_Psicologo_Interface.css" />
  </head>
  <body style="background-color: rgb(44, 49, 47)">
    <header></header>
    <aside>
      <div>
        <a href="/">
          <img class="voltar" src="/img/Back.svg" alt="Voltar" title="Voltar" />
        </a>
      </div>
    </aside>

    <main>
      <div class="conteudo-centralizado">
        <h2>Encontre o(a) psicólogo(a):</h2>
        <div class="input-group">
          <input
            type="text"
            id="input-nome-email"
            class="input-field"
            placeholder="Digite Nome, E-mail ou CPF"
          />
        </div>

        <div class="caixa-pesquisa">
          <button id="botao-buscar" class="input-field cadastro-btn">
            Buscar
          </button>
        </div>

        <div class="lista"></div>
      </div>
    </main>
    <script src="/scripts/procurar_psicologo.js"></script>
  </body>
</html>
